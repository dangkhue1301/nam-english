name: Xuất bản GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Dùng Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài thư viện kiểm thử
        run: npm ci --ignore-scripts
      - name: Kiểm tra chức năng
        run: npm test
      - name: Tạo bản tĩnh
        run: npm run build
      - name: Cấu hình Pages
        uses: actions/configure-pages@v5
      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
